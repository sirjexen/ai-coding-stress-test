<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit — Project OS</title><link rel="stylesheet" href="./styles.css"></head>
<body><aside class="sidebar"><div class="brand"><div class="logo">O</div><b>Orbit</b></div><nav><a class="active">◫ Overview</a><a>⌁ My tasks</a><a>◎ Timeline</a><a>◌ Reports</a></nav><div class="sidebar-bottom"><button id="command">⌘ Command palette <kbd>⌘K</kbd></button><button id="theme">◐ Toggle theme</button></div></aside>
<main><header class="topbar"><div><span class="eyebrow">ACME PRODUCT</span><h1>Launch workspace</h1><p>Plan, prioritize and ship the next release.</p></div><div class="actions"><button id="export">Export</button><label class="button">Import<input id="importFile" type="file" accept="application/json" hidden></label><button id="newTask" class="primary">＋ New task</button></div></header>
<section id="metrics" class="metrics"></section>
<section class="toolbar"><label class="search">⌕ <input id="search" placeholder="Search tasks, tags or people…"></label><select id="priority"><option value="all">All priorities</option><option>urgent</option><option>high</option><option>medium</option><option>low</option></select><select id="assignee"><option value="all">Everyone</option><option>Maya</option><option>Rafi</option><option>Nadia</option><option>Unassigned</option></select><button id="reset">Reset demo</button></section>
<div class="workspace"><section id="board" class="board"></section><aside class="activity-panel"><header><b>Activity</b><span>Live</span></header><ul id="activity"></ul><div class="tip"><b>Power user</b><p>Drag cards between columns. Press <kbd>N</kbd> for a new task or <kbd>⌘K</kbd> for commands.</p></div></aside></div></main>
<dialog id="taskDialog"><form id="taskForm" method="dialog"><div class="dialog-head"><h2 id="modalTitle">Create task</h2><button type="button" id="cancel">×</button></div><input type="hidden" name="id"><label>Title<input name="title" required maxlength="80"></label><label>Description<textarea name="description" rows="3"></textarea></label><div class="grid2"><label>Status<select name="status"><option value="backlog">Backlog</option><option value="progress">In progress</option><option value="review">Review</option><option value="done">Done</option></select></label><label>Priority<select name="priority"><option>low</option><option selected>medium</option><option>high</option><option>urgent</option></select></label><label>Assignee<select name="assignee"><option>Maya</option><option>Rafi</option><option>Nadia</option><option>Unassigned</option></select></label><label>Due date<input name="due" type="date"></label></div><label>Tags<input name="tags" placeholder="frontend, growth"></label><footer><button id="deleteTask" type="button" class="danger">Delete</button><span></span><button type="button" id="cancel" onclick="document.querySelector('#taskDialog').close()">Cancel</button><button class="primary" value="default">Save task</button></footer></form></dialog>
<dialog id="palette" class="palette"><input id="paletteInput" autofocus placeholder="Type a command…"><div id="commands"><button data-action="new">＋ Create new task</button><button data-action="theme">◐ Toggle theme</button><button data-action="export">⇩ Export workspace</button><button data-action="reset">↻ Reset demo data</button></div></dialog>
<script type="module" src="./src/app.js"></script></body></html>
